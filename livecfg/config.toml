# Phase-one conservative LIVE config. Scale across independent markets while
# retaining small per-market quotes and explicit hard risk limits.
[wallet]
chain_id = 137
signature_type = 3
clob_host = "https://clob.polymarket.com"
gamma_host = "https://gamma-api.polymarket.com"
data_api_host = "https://data-api.polymarket.com"
polygon_rpc = "https://polygon-bor-rpc.publicnode.com"

[engine]
debounce_ms = 250
reconcile_interval_s = 60
catalog_refresh_s = 300
heartbeat = true
heartbeat_interval_s = 5
journal = true
loop = "uvloop"

[risk]
max_total_exposure_usdc = 60.0       # phase-one hard ceiling on deployed capital
max_event_group_loss_usdc = 55.0     # 50-share reward floor + small buffer
max_market_notional_usdc = 55.0      # per-market cap; fits current 50-share rewards
daily_loss_kill_usdc = 12.0          # stop trading at ~$12 mark-to-market loss
ws_stale_halt_s = 8.0
user_ws_blind_halt_s = 12.0
heartbeat_halt_failures = 3
max_order_error_rate = 0.25

[execution]
rate_budget_fraction = 0.15
post_only = true
max_orders_per_batch = 15

[merge]
enabled = false

[paths]
db = "livecfg/state.db"
journal_dir = "livecfg/journal"
log_dir = "livecfg/logs"
